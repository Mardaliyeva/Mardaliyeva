<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" role="img" aria-labelledby="title desc">
  <title id="title">Ayten Merdeliyeva education table</title>
  <desc id="desc">A neon-bordered table listing education, study periods, grades, and scholarships.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#500724"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#a78bfa" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .text{font-family:Consolas,'Courier New',monospace;fill:#e9e7ff}
      .head{font-size:15px;font-weight:700;letter-spacing:.5px}
      .strong{font-size:15px;font-weight:700}
      .detail{font-size:14px;fill:#c4b5fd}
      .rule{stroke:#6d4aa5;stroke-opacity:.72;stroke-width:1}
    </style>
  </defs>

  <rect x="4" y="4" width="992" height="284" rx="12" fill="#0c0819" stroke="url(#border)" stroke-width="4" filter="url(#glow)"/>
  <rect x="14" y="14" width="972" height="264" fill="url(#grid)"/>
  <path d="M14 26Q14 14 26 14H974Q986 14 986 26V72H14Z" fill="url(#header)"/>

  <line x1="205" y1="14" x2="205" y2="278" class="rule"/>
  <line x1="515" y1="14" x2="515" y2="278" class="rule"/>
  <line x1="700" y1="14" x2="700" y2="278" class="rule"/>
  <line x1="14" y1="72" x2="986" y2="72" stroke="url(#border)" stroke-width="2"/>
  <line x1="14" y1="140" x2="986" y2="140" class="rule"/>
  <line x1="14" y1="208" x2="986" y2="208" class="rule"/>
  <rect x="14" y="140" width="972" height="68" fill="#8b5cf6" opacity=".045"/>

  <text x="31" y="50" class="text head">INSTITUTION</text>
  <text x="225" y="50" class="text head">PROGRAM</text>
  <text x="535" y="50" class="text head">PERIOD</text>
  <text x="720" y="50" class="text head">ACHIEVEMENT</text>

  <text x="31" y="112" class="text strong">UNEC</text>
  <text x="225" y="102" class="text detail">Bachelor's in</text>
  <text x="225" y="123" class="text detail">Information Technology</text>
  <text x="535" y="112" class="text detail">2023 – Present</text>
  <text x="720" y="112" class="text strong">GPA: 96/100</text>

  <text x="31" y="180" class="text strong">AI Academy</text>
  <text x="225" y="180" class="text detail">AI Engineering</text>
  <text x="535" y="180" class="text detail">2025 – Present</text>
  <text x="720" y="180" class="text strong">Full scholarship</text>

  <text x="31" y="248" class="text strong">Code Academy</text>
  <text x="225" y="248" class="text detail">Data Science</text>
  <text x="535" y="238" class="text detail">May – Aug</text>
  <text x="535" y="259" class="text detail">2024</text>
  <text x="720" y="238" class="text strong">Grade: 94/100</text>
  <text x="720" y="259" class="text detail">85% scholarship</text>

  <g fill="url(#border)">
    <rect x="4" y="4" width="28" height="5"/><rect x="4" y="4" width="5" height="28"/>
    <rect x="968" y="4" width="28" height="5"/><rect x="991" y="4" width="5" height="28"/>
    <rect x="4" y="283" width="28" height="5"/><rect x="4" y="260" width="5" height="28"/>
    <rect x="968" y="283" width="28" height="5"/><rect x="991" y="260" width="5" height="28"/>
  </g>
</svg>
