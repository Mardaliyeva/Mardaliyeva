<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="367" viewBox="0 0 1000 367" role="img" aria-labelledby="title desc">
  <title id="title">Ayten Merdeliyeva skills table</title>
  <desc id="desc">A neon-bordered table listing four AI, machine learning, and data analysis skill areas.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#500724"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#a78bfa" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .text{font-family:Consolas,'Courier New',monospace;fill:#e9e7ff}
      .head{font-size:17px;font-weight:700;letter-spacing:1px}
      .area{font-size:16px;font-weight:700}
      .detail{font-size:15px;fill:#c4b5fd}
      .rule{stroke:#6d4aa5;stroke-opacity:.72;stroke-width:1}
    </style>
  </defs>

  <rect x="4" y="4" width="992" height="359" rx="12" fill="#0c0819" stroke="url(#border)" stroke-width="4" filter="url(#glow)"/>
  <rect x="14" y="14" width="972" height="339" fill="url(#grid)"/>
  <path d="M14 26Q14 14 26 14H974Q986 14 986 26V75H14Z" fill="url(#header)"/>

  <line x1="342" y1="14" x2="342" y2="353" class="rule"/>
  <line x1="14" y1="75" x2="986" y2="75" stroke="url(#border)" stroke-width="2"/>
  <line x1="14" y1="144" x2="986" y2="144" class="rule"/>
  <line x1="14" y1="213" x2="986" y2="213" class="rule"/>
  <line x1="14" y1="282" x2="986" y2="282" class="rule"/>

  <rect x="14" y="144" width="972" height="69" fill="#8b5cf6" opacity=".045"/>
  <rect x="14" y="282" width="972" height="71" fill="#8b5cf6" opacity=".045"/>

  <text x="36" y="53" class="text head">AREA</text>
  <text x="368" y="53" class="text head">CAPABILITIES</text>

  <rect x="35" y="102" width="12" height="12" fill="#22d3ee"/>
  <text x="62" y="115" class="text area">Machine Learning</text>
  <text x="368" y="115" class="text detail">Classification · Regression · Clustering · Time Series</text>

  <rect x="35" y="171" width="12" height="12" fill="#4ade80"/>
  <text x="62" y="184" class="text area">AI &amp; LLM Applications</text>
  <text x="368" y="184" class="text detail">RAG Systems · Chatbots · Automation · AI-powered Applications</text>

  <rect x="35" y="240" width="12" height="12" fill="#d946ef"/>
  <text x="62" y="253" class="text area">Deep Learning &amp;</text>
  <text x="62" y="273" class="text area" font-size="14">AI Foundations</text>
  <text x="368" y="253" class="text detail">Neural Networks · Natural Language Processing · Mathematics for AI</text>

  <rect x="35" y="309" width="12" height="12" fill="#f472b6"/>
  <text x="62" y="322" class="text area">Data Analytics</text>
  <text x="368" y="322" class="text detail">Visualization · Statistics · Predictive Analytics</text>

  <g fill="url(#border)">
    <rect x="4" y="4" width="28" height="5"/><rect x="4" y="4" width="5" height="28"/>
    <rect x="968" y="4" width="28" height="5"/><rect x="991" y="4" width="5" height="28"/>
    <rect x="4" y="358" width="28" height="5"/><rect x="4" y="335" width="5" height="28"/>
    <rect x="968" y="358" width="28" height="5"/><rect x="991" y="335" width="5" height="28"/>
  </g>
</svg>
